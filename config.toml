# LLM provider selection for the Outreach Planner.
#
# This file is committed and contains NO secrets. API keys live in .env:
#   claude   -> ANTHROPIC_API_KEY (or CLAUDE_API_KEY)
#   chatgpt  -> OPENAI_API_KEY
#   deepseek -> DEEPSEEK_API_KEY
#   groq     -> GROQ_API_KEY
#
# Switch providers by changing `provider` below.

[llm]
# active provider: claude | chatgpt | deepseek | groq
provider = "groq"

[llm.claude]
model = "claude-sonnet-4-6"
max_tokens = 500

[llm.chatgpt]
model = "gpt-4o-mini"

[llm.deepseek]
model = "deepseek-chat"

# Groq is the recommended free, zero-cost provider (free tier, no credit card).
# Get a key at https://console.groq.com
[llm.groq]
model = "llama-3.3-70b-versatile"

# Optional: pick a different configured provider to act as the LLM judge in the
# copy quality eval (evals/run_copy_eval.py), so a model doesn't grade its own
# output. The judge reuses that provider's [llm.<provider>] model. If this block
# is omitted, the judge uses the active provider above. The judge is never
# hardcoded to a vendor -- it always resolves through this file, exactly like
# generation does.
# [llm.judge]
# provider = "claude"
