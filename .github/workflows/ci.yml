name: CI

on:
  push:
    branches: [master]
  pull_request:

# Mini-PR pushes are frequent: cancel superseded runs per PR, but never cancel
# master pushes (their queue order matters for the coverage badge).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The test suite mocks every LLM provider call, so no real API key is
  # needed here. Real-provider evals are a separate, gated workflow.
  DJANGO_SETTINGS_MODULE: project.settings
  # Required by settings.py; a throwaway value is fine, CI never serves traffic.
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy project/app/services/

  frontend:
    name: Frontend (typecheck, tests, bundle freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The React bundle is committed and served by Django with no Node in the
      # image, so a stale bundle means the app serves old code while the new
      # source sits in the repo looking merged. Nothing else catches that.
      - name: Fail if the committed bundle is stale
        run: git diff --exit-code -- project/app/static/frontend/

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 4.2.30 only advertises 3.9-3.12 support, but the runtime was
        # bumped to require 3.12+ (MUS-18); 3.13 is included here because the
        # full suite has been verified to pass on it.
        python-version: ["3.12", "3.13"]
        database: ["sqlite", "postgres"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # settings.py falls back to SQLite when DATABASE_URL is unset.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check for missing migrations
        run: |
          # Same dance as the test step below -- this command runs Django's
          # system checks, which touch the database, so an empty DATABASE_URL
          # fails it on the sqlite leg before it ever looks at a migration.
          [ -n "$DATABASE_URL" ] || unset DATABASE_URL
          python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: |
          # dj_database_url treats a *present-but-empty* DATABASE_URL as
          # malformed (not "unset"), so drop it for the sqlite leg rather
          # than leaving it set to "".
          [ -n "$DATABASE_URL" ] || unset DATABASE_URL
          coverage run manage.py test project.app
          coverage report

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: coverage run manage.py test project.app
      # The badge lives on the unprotected `badges` branch (README points
      # shields.io at its coverage.json): a no-bypass ruleset on master forbids
      # the old direct push of a README edit.
      - name: Write shields.io endpoint JSON
        run: |
          PCT=$(coverage report --format=total)
          if [ "$PCT" -ge 90 ]; then COLOR=brightgreen; elif [ "$PCT" -ge 75 ]; then COLOR=yellow; else COLOR=red; fi
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' "$PCT" "$COLOR" > "$RUNNER_TEMP/coverage.json"
      - name: Push to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -r -f -q . 2>/dev/null || true
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --staged --quiet || git commit -m "chore: update coverage badge data"
          git push origin badges

  # The rules regression eval is part of plain CI: pure Python against the
  # committed golden set + baseline, no network, milliseconds.
  rules-eval:
    name: Rules eval (baseline gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python evals/run_rules_eval.py

  # The workflow gate's own test suite (scripts/check_scope.py + red_proof.py)
  # must run green in the same CI that the gate later protects.
  gate-tests:
    name: Workflow-gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s scripts/tests

  # Rulesets require status checks *by name*, and the test matrix produces one
  # name per cell — this single stable name is what gets protected. It fails on
  # any failed/cancelled/skipped dependency. coverage-badge is deliberately not
  # a dependency: it only runs on master pushes, so on PRs it would always
  # report "skipped" and wedge this job red.
  ci-ok:
    name: ci-ok
    needs: [lint, typecheck, frontend, test, rules-eval, gate-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every dependency succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {name: spec["result"] for name, spec in needs.items() if spec["result"] != "success"}
          if bad:
              print(f"ci-ok: FAIL — non-success dependencies: {bad}")
              sys.exit(1)
          print("ci-ok: PASS —", ", ".join(sorted(needs)))
          EOF
