name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The test suite mocks every LLM provider call, so no real API key is
  # needed here. Real-provider evals are a separate, gated workflow.
  DJANGO_SETTINGS_MODULE: project.settings
  # Required by settings.py; a throwaway value is fine, CI never serves traffic.
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy project/app/services/

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 4.2.30 only advertises 3.9-3.12 support, but the runtime was
        # bumped to require 3.12+ (MUS-18); 3.13 is included here because the
        # full suite has been verified to pass on it.
        python-version: ["3.12", "3.13"]
        database: ["sqlite", "postgres"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # settings.py falls back to SQLite when DATABASE_URL is unset.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          # dj_database_url treats a *present-but-empty* DATABASE_URL as
          # malformed (not "unset"), so drop it for the sqlite leg rather
          # than leaving it set to "".
          [ -z "$DATABASE_URL" ] && unset DATABASE_URL
          coverage run manage.py test project.app
          coverage report

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: coverage run manage.py test project.app
      - name: Update coverage badge in README
        run: |
          PCT=$(coverage report --format=total)
          if [ "$PCT" -ge 90 ]; then COLOR=brightgreen; elif [ "$PCT" -ge 75 ]; then COLOR=yellow; else COLOR=red; fi
          sed -i -E "s#coverage-[0-9]+%25-[a-z]+#coverage-${PCT}%25-${COLOR}#" README.md
      - name: Commit badge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
