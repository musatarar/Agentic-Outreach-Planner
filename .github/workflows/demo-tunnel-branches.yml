name: Demo tunnel branch list

# Keeps the branch dropdown in demo-tunnel.yml current. A dispatch form is
# rendered from the workflow file before any runner exists, so a `choice` input
# can only ever offer literals committed to the file -- the only way to keep
# them true is to edit the file, which is what this does.
#
# It opens a PR rather than pushing: master takes no direct pushes (the same
# ruleset that sends the coverage badge to the `badges` branch).
#
# CI on that PR needs a token that is not GITHUB_TOKEN -- runs it triggers do
# not start further workflow runs, by design, so a GITHUB_TOKEN PR sits with no
# checks and cannot satisfy `ci-ok`. Set BRANCH_LIST_PAT (a fine-grained PAT
# with contents:write + pull-requests:write) and CI runs by itself; without it
# the PR still opens and a human push or reopen starts the checks.

on:
  schedule:
    # Daily. Branch churn between runs is what the `create`/`delete` triggers
    # below are for; this is the backstop for anything they miss.
    - cron: "17 6 * * *"
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Branch churn arrives in bursts; only the last one needs to win.
concurrency:
  group: demo-tunnel-branch-list
  cancel-in-progress: true

env:
  PR_BRANCH: chore/demo-tunnel-branch-list

jobs:
  regenerate:
    name: Regenerate the branch dropdown
    # `create` and `delete` also fire for tags, which the dropdown does not list.
    if: github.event_name != 'create' && github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.BRANCH_LIST_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the dropdown from the branches that exist
        id: rewrite
        run: |
          set -euo pipefail

          # Most recently committed first, so the cap keeps the branches someone
          # might actually want to demo. The PR branch this workflow pushes is
          # excluded: offering it would be offering the bot's own bookkeeping.
          BRANCHES=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' \
            refs/remotes/origin \
            | sed 's|^origin/||' \
            | grep -vx 'HEAD' \
            | grep -vx "$PR_BRANCH" \
            | grep -vx 'badges')

          echo "$BRANCHES" | python3 scripts/refresh_demo_tunnel_branches.py

          if git diff --quiet -- .github/workflows/demo-tunnel.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The dropdown already matches the branches that exist."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- .github/workflows/demo-tunnel.yml
          fi

      - name: Open or update the pull request
        if: steps.rewrite.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LIST_PAT || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, force-pushed: the list only ever has one
          # correct value, so a second open PR would just be a stale one.
          git checkout -B "$PR_BRANCH"
          git add .github/workflows/demo-tunnel.yml
          git commit -m "chore(demo-tunnel): refresh the branch dropdown"
          git push --force-with-lease origin "$PR_BRANCH"

          if [ -n "$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing PR updated by the push."
          else
            gh pr create \
              --base master \
              --head "$PR_BRANCH" \
              --title "chore(demo-tunnel): refresh the branch dropdown" \
              --body "$(printf '%s\n' \
                'Branches came or went, so the demo tunnel dispatch form no longer offers the right list.' \
                '' \
                'Generated by `.github/workflows/demo-tunnel-branches.yml` — do not edit the marked block by hand.' \
                '' \
                '---' \
                '_Generated by [Claude Code](https://claude.ai/code)_')"
          fi
