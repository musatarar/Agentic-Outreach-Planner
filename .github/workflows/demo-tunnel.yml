name: Demo tunnel

# Boots the app on a runner and publishes it over a Cloudflare quick tunnel, so
# a reviewer can click a link and drive the real thing instead of reading a
# screenshot. Manual dispatch only: while the job runs the URL is public, and
# the sign-in allowlist is the whole gate.
#
# The branch comes from the dispatch form's own "Use workflow from" picker,
# which lists every branch and defaults to master. That is a real list to choose
# from, which a text field cannot be -- workflow_dispatch has no branch-typed
# input, and a `choice` would be a hardcoded list going stale the day it merged.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional: a tag or SHA to serve instead of the branch picked above"
        required: false
        default: ""
      duration:
        description: "How long to hold the tunnel open"
        type: choice
        default: "30 minutes"
        options:
          - "15 minutes"
          - "30 minutes"
          - "1 hour"
          - "2 hours"
          - "4 hours"
      login_email:
        description: "The one address allowed to sign in (delivery is console, so the link lands in this job's log -- any address works)"
        required: false
        default: demo@example.com

permissions:
  contents: read

# One tunnel at a time: a fresh dispatch replaces the running one.
concurrency:
  group: demo-tunnel
  cancel-in-progress: true

jobs:
  serve:
    name: Serve ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    # The hold step ends on its own; this is the backstop if it cannot. The
    # expression language has no arithmetic, so the chosen duration maps to its
    # own ceiling (itself plus setup headroom) by hand. Keep in step with
    # HOLD_MINUTES below: each ceiling has to stay the larger of the two.
    timeout-minutes: ${{ fromJSON('{"15 minutes":25,"30 minutes":40,"1 hour":70,"2 hours":130,"4 hours":250}')[inputs.duration] }}
    env:
      # The duration reads as English in the dispatch form; the hold step needs
      # it as a number of minutes.
      HOLD_MINUTES: ${{ fromJSON('{"15 minutes":15,"30 minutes":30,"1 hour":60,"2 hours":120,"4 hours":240}')[inputs.duration] }}
      DJANGO_SETTINGS_MODULE: project.settings
      # Debug pages on a public URL would hand out settings and tracebacks.
      DJANGO_DEBUG: "False"
      # SQLite: DATABASE_URL stays unset, and the file dies with the runner.
      LOGIN_LINK_DELIVERY: console
      LOGIN_ALLOWED_EMAILS: ${{ inputs.login_email }}
      # Optional. Set any of these as repo secrets to make the LLM copy step
      # work; without one the app still serves the seeded demo pipeline.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        id: code
        with:
          # Empty override -> the branch the run was dispatched from.
          ref: ${{ inputs.ref || github.ref }}

      # A mistyped override otherwise fails with checkout's own "couldn't find
      # remote ref" and nothing to compare it against. `ls-remote`, not
      # `branch -r`: there is no clone to read when the clone is what failed.
      - name: Say what could have been served
        if: failure() && steps.code.outcome == 'failure'
        run: |
          set -uo pipefail
          echo "::error::no ref named '${{ inputs.ref }}' -- the branches and tags this repo has:"
          git ls-remote --heads --tags --refs \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            | sed 's|.*refs/heads/|  branch: |; s|.*refs/tags/|  tag:    |'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Mint per-run secrets
        run: |
          set -euo pipefail
          SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')
          FERNET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$FERNET"
          # Generated per run and thrown away with the runner -- nothing they
          # protect (session cookies, saved provider keys) outlives the job.
          echo "DJANGO_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "LLM_KEY_ENCRYPTION_KEY=$FERNET" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"

      - name: Open the tunnel
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cloudflared.log"

          # Quick tunnel: no Cloudflare account, no token, a random
          # *.trycloudflare.com hostname that dies with the process. It starts
          # before Django because every allowlist below is keyed to that
          # hostname, which only exists once Cloudflare hands it out.
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 \
            --logfile "$LOG" >/dev/null 2>&1 &
          echo "CLOUDFLARED_PID=$!" >> "$GITHUB_ENV"

          URL=""
          for _ in $(seq 60); do
            URL=$(grep -ohE 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::cloudflared never reported a URL"
            cat "$LOG" || true
            exit 1
          fi

          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          echo "DJANGO_ALLOWED_HOSTS=${URL#https://},127.0.0.1,localhost" >> "$GITHUB_ENV"
          # TLS terminates at Cloudflare, so the browser's Origin is https while
          # the app sees http: without this every authenticated POST is a 403.
          echo "DJANGO_CSRF_TRUSTED_ORIGINS=$URL" >> "$GITHUB_ENV"
          # Magic links must point at the tunnel, not at 127.0.0.1.
          echo "LOGIN_LINK_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Migrate and seed the demo pipeline
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python scripts/populate_demo_data.py

      - name: Start the app
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/django.log"

          # --insecure because DEBUG is off: the dev server otherwise refuses to
          # serve the committed React bundle, and the SPA renders blank without it.
          nohup python manage.py runserver 0.0.0.0:8000 --noreload --insecure \
            > "$LOG" 2>&1 &
          echo "DJANGO_PID=$!" >> "$GITHUB_ENV"

          READY=""
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then READY=1; break; fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            echo "::error::the app never came up"
            cat "$LOG" || true
            exit 1
          fi

          # The same check from the outside: proves the edge reaches the origin
          # and that the tunnel hostname survived ALLOWED_HOSTS.
          EDGE=""
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "$TUNNEL_URL/"; then EDGE=1; break; fi
            sleep 2
          done
          if [ -z "$EDGE" ]; then
            echo "::error::the tunnel never reached the app"
            tail -50 "$RUNNER_TEMP/cloudflared.log" || true
            tail -50 "$LOG" || true
            exit 1
          fi

      - name: Publish the link
        run: |
          set -euo pipefail
          {
            echo "## Demo tunnel is up"
            echo
            echo "### $TUNNEL_URL"
            echo
            echo "Serving \`${{ inputs.ref || github.ref_name }}\` (\`$(git rev-parse --short HEAD)\`) for ${{ inputs.duration }}."
            echo
            echo "1. Open the link and request a sign-in link for \`${{ inputs.login_email }}\`."
            echo "2. Delivery is \`console\`, so the magic link is printed in this job's live"
            echo "   log (the **Hold the tunnel open** step). Paste it into the browser."
            echo
            echo "Cancel the run to take the tunnel down early. The URL stops resolving the"
            echo "moment the job ends, and the SQLite database goes with it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Demo tunnel: $TUNNEL_URL"

      - name: Hold the tunnel open
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + HOLD_MINUTES * 60 ))

          # The server log is the sign-in channel: LOGIN_LINK_DELIVERY=console
          # prints each magic link here and nowhere else, so live-tail it and
          # whoever is driving the demo can read their link out of this step.
          tail -f "$RUNNER_TEMP/django.log" &
          TAIL_PID=$!

          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$DJANGO_PID" 2>/dev/null; then
              echo "::error::the app exited"
              kill "$TAIL_PID" 2>/dev/null || true
              exit 1
            fi
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "::error::cloudflared exited"
              kill "$TAIL_PID" 2>/dev/null || true
              exit 1
            fi
            echo "--- $TUNNEL_URL is up, $(( (END - $(date +%s) + 59) / 60 )) min left ---"
            sleep 60
          done

          kill "$TAIL_PID" 2>/dev/null || true
          echo "Time is up; taking the tunnel down."

      - name: Tear down
        if: always()
        run: |
          kill "${DJANGO_PID:-}" 2>/dev/null || true
          kill "${CLOUDFLARED_PID:-}" 2>/dev/null || true
          echo "::group::Server log"
          tail -200 "$RUNNER_TEMP/django.log" 2>/dev/null || true
          echo "::endgroup::"
